name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build Mod with ndk-build
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk NDK_DEBUG=0

      - name: Prepare Release Binaries
        run: |
          cp libs/arm64-v8a/libnpchealthbar.so ./libnpchealthbar-arm64-v8a.so
          cp libs/armeabi-v7a/libnpchealthbar.so ./libnpchealthbar-armeabi-v7a.so

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            libnpchealthbar-arm64-v8a.so
            libnpchealthbar-armeabi-v7a.so
          generate_release_notes: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: NPCHealthBar-libs
          path: |
            libnpchealthbar-arm64-v8a.so
            libnpchealthbar-armeabi-v7a.so
